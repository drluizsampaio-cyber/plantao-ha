<style>
:root{
  --navy:#12205F; --royal:#3D6BC6; --sky:#9DB8E8; --ice:#EEF2FA; --paper:#FFFFFF;
  --ink:#1A2440; --mut:#66708C; --line:#D8E0F0;
  --ok:#1E8E5A; --okbg:#E4F4EC; --warn:#B97709; --warnbg:#FBF1DC; --danger:#B3352B; --dangerbg:#F9E7E4;
  --teal:#157A8C; --green:#2E7D5B;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Archivo',system-ui,sans-serif;background:var(--ice);color:var(--ink);min-height:100dvh;font-size:15px}
.mono{font-family:'IBM Plex Mono',monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none}
select,input,textarea{font-family:inherit;font-size:16px}
:focus-visible{outline:3px solid var(--royal);outline-offset:2px}

/* ---------- header ---------- */
header{background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
header img{height:38px}
header .who{margin-left:auto;text-align:right;font-size:12px;color:var(--mut)}
header .who b{display:block;color:var(--navy);font-size:13px}
header .who button{color:var(--royal);font-size:12px;font-weight:600;text-decoration:underline;padding:2px}

/* ---------- login ---------- */
.login{max-width:420px;margin:0 auto;padding:48px 24px;text-align:center}
.login img{width:220px;max-width:80%;margin-bottom:8px}
.login .app{font-weight:800;font-size:26px;letter-spacing:-.5px;color:var(--navy);font-stretch:110%}
.login .sub{color:var(--mut);margin:6px 0 32px}
.login label{display:block;text-align:left;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:18px 0 6px}
.login select{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper)}
.login .go{width:100%;margin-top:26px;background:var(--navy);color:#fff;font-weight:700;font-size:16px;padding:15px;border-radius:12px}
.login .go:active{transform:scale(.98)}
.login .note{margin-top:20px;font-size:12px;color:var(--mut)}

/* ---------- layout ---------- */
main{max-width:680px;margin:0 auto;padding:16px 14px 96px}
h2{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:20px 2px 10px}
.empty{background:var(--paper);border:1.5px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--mut);font-size:14px}

/* ---------- wristband card (assinatura visual do app) ---------- */
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;display:flex;overflow:hidden;box-shadow:0 1px 2px rgba(18,32,95,.05)}
.band{width:52px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:2px;border-right:2px dashed rgba(255,255,255,.55)}
.band .d{font-size:19px;font-weight:800;line-height:1}
.band .m{font-size:10px;font-weight:700;text-transform:uppercase;opacity:.85}
.band::after{content:"";position:absolute;left:44px;top:50%;width:14px;height:14px;margin-top:-7px;background:var(--ice);border-radius:50%;border:1px solid var(--line)}
.b-DIA{background:var(--royal)} .b-NOITE{background:var(--navy)} .b-DIAR{background:var(--teal)} .b-UNI{background:var(--green)}
.card .body{flex:1;padding:10px 12px;min-width:0}
.card .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .med{font-weight:700;font-size:15.5px}
.card .papel{font-size:12px;color:var(--mut)}
.card .hrs{font-size:12.5px;color:var(--mut);margin-top:3px}
.card .hrs b{color:var(--ink);font-weight:600}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.c-pend{background:var(--ice);color:var(--mut)} .c-in{background:#E3ECFB;color:var(--royal)}
.c-ok{background:var(--okbg);color:var(--ok)} .c-falta{background:var(--dangerbg);color:var(--danger)}
.c-troca{background:var(--warnbg);color:var(--warn)} .c-def{background:var(--warnbg);color:var(--warn)}
.card .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{font-size:13px;font-weight:700;padding:9px 14px;border-radius:9px;border:1.5px solid var(--line);color:var(--navy);background:var(--paper)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.btn.dan{color:var(--danger);border-color:var(--danger)}
.btn:active{transform:scale(.97)}
.stamp{font-size:11.5px;color:var(--mut);margin-top:8px;line-height:1.6}
.stamp b{color:var(--ink)}

/* ---------- calendário mensal ---------- */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 8px;margin:0 auto 6px;max-width:340px}
.calgrid .wd{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--mut);text-align:center;padding-bottom:2px}
.calgrid button{height:32px;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center}
.calgrid button:hover{background:var(--ice)}
.calgrid button.today{box-shadow:inset 0 0 0 2px var(--royal)}
.calgrid button.sel{background:var(--navy);color:#fff}
.calgrid button.feriado{color:var(--danger)}
.calgrid button.feriado::before{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--danger)}
.calgrid button.sel.feriado{color:#fff}
.calgrid button.sel.feriado::before{background:#fff}
.mesbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.mesbar-lbl{font-size:13px;font-weight:700;color:var(--mut)}
.messel{padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font-weight:600;color:var(--navy)}
.calgrid button{position:relative}
.calgrid button.alerta::after{content:"";position:absolute;top:3px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--paper);animation:pisca 1s steps(2,start) infinite}
@keyframes pisca{to{visibility:hidden}}
.blink{animation:pisca 1s steps(2,start) infinite}
.filters{display:flex;gap:8px;margin-bottom:8px}
.seg{flex:1;display:flex;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:9px 0;font-size:13px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--navy);color:#fff}

/* ---------- agora ---------- */
.now-head{background:var(--navy);color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:14px}
.now-head .t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--sky)}
.now-head .big{font-size:22px;font-weight:800;margin-top:2px}
.now-head .sub{font-size:13px;color:var(--sky);margin-top:2px}

/* ---------- fechamento ---------- */
.tblwrap{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
th{background:var(--navy);color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:9px 10px;text-align:left;position:sticky;top:0}
td{padding:8px 10px;border-top:1px solid var(--line)}
td.n{text-align:center;font-family:'IBM Plex Mono',monospace}
tr:nth-child(even) td{background:#F7F9FD}
.tools{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.tools .btn{flex:1 1 150px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.kpi .v{font-size:22px;font-weight:800;color:var(--navy)}
.kpi .l{font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--mut);letter-spacing:.04em}
.kpi.g .v{color:var(--ok)} .kpi.r .v{color:var(--danger)} .kpi.y .v{color:var(--warn)}

/* ---------- tabbar ---------- */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 0 8px;font-size:11px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--navy)}
nav button.on::after{content:"";width:18px;height:3px;border-radius:2px;background:var(--royal);margin-top:1px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(18,32,95,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);border-radius:18px 18px 0 0;width:100%;max-width:520px;padding:20px 18px 28px}
.sheet h3{font-size:17px;font-weight:800;color:var(--navy);margin-bottom:4px}
.sheet p{font-size:13.5px;color:var(--mut);margin-bottom:14px}
.sheet select,.sheet input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:12px;background:var(--paper)}
.sheet .row{display:flex;gap:10px}
.sheet .row .btn{flex:1;padding:13px;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;background:var(--navy);color:#fff;font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:99px;z-index:60;box-shadow:0 6px 20px rgba(18,32,95,.35);opacity:0;transition:opacity .25s}
.toast.show{opacity:1}

@media (max-width:420px){
  main{padding:12px 10px 94px}
  header{padding:8px 12px}
  header img{height:32px}
  .card .med{font-size:14.5px}
  .kpi .v{font-size:19px}
  .kpi{padding:8px 6px}
  .btn{padding:10px 12px}
}
@media (min-width:700px){
  nav{position:sticky;top:59px;bottom:auto;border-top:none;border-bottom:1px solid var(--line)}
  main{padding-bottom:30px}
  .toast{bottom:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- print: folha de assinatura ---------- */
#printArea{display:none}
@media print{
  body>*{display:none!important}
  #printArea{display:block!important;font-family:'Archivo',sans-serif;color:#000}
  #printArea .ph{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  #printArea .ph img{height:42px}
  #printArea h1{font-size:15px}
  #printArea .pi{font-size:10px;margin-bottom:8px}
  #printArea table{width:100%;border-collapse:collapse;font-size:9.5px;min-width:0}
  #printArea th,#printArea td{border:1px solid #999;padding:4px 5px;text-align:left;background:#fff;color:#000;position:static;text-transform:none;letter-spacing:0}
  #printArea th{background:#E8ECF5;font-size:9px}
  #printArea td.sig{width:130px;height:24px}
  #printArea tr{page-break-inside:avoid}
  /* escala do mês em 1 página */
  #printArea.onepage{}
  @page{margin:8mm}
  #printArea.onepage table.cal{table-layout:fixed;width:100%}
  #printArea.onepage .cal th{background:#12205F;color:#fff;font-size:8.5px;padding:3px;text-align:center;border:1px solid #12205F}
  #printArea.onepage .cal td{vertical-align:top;padding:2px 3px;height:64px;font-size:7.2px;line-height:1.35;border:1px solid #888}
  #printArea.onepage .cal td.off{background:#F0F2F7}
  #printArea.onepage .dn{font-size:9.5px;font-weight:800}
  #printArea.onepage .ln{white-space:normal}
  #printArea.onepage .ln b{font-size:6.8px;background:#E8ECF5;padding:0 2px;border-radius:2px}
  #printArea.onepage .ln.uni b{background:#DFEEE7}
  #printArea.onepage h1{font-size:13px}
  #printArea.onepage .pi{font-size:8.5px}
  #printArea.onepage .pgbreak{page-break-before:always;margin-top:6px}
}

/* ---------- estado compartilhado: cache local espelhando o banco ---------- */
let S = {};            // { shiftId:{status,in,out,troca,intern...}, _escala:{shifts,info} }
let AUD = [];          // trilha de auditoria (carregada do banco)
let user = null;       // {tipo:'med'|'coord'|'adm', nome, email}
let tab = 'agora';
let selDate = null;
let selSetor = 'TODOS';

async function carregarNuvem(){
  const {data,error} = await supa.from('estado').select('chave,valor');
  if(error){ toast('Erro ao carregar dados do banco — verifique a internet.'); return false; }
  S = {}; ESCALAS = {};
  let escalaAntiga = null;
  (data||[]).forEach(r=>{
    if(r.chave==='escala'){ escalaAntiga = r.valor; }                       // formato v10 (única)
    else if(r.chave.startsWith('escala:')){ ESCALAS[r.chave.slice(7)] = r.valor; } // formato v11 (por mês)
    else if(r.chave.startsWith('reg:')) S[r.chave.slice(4)]=r.valor;
  });
  // MIGRAÇÃO v10 -> v11: só roda na PRIMEIRA vez (quando ainda não existe NENHUMA gaveta escala:*)
  // Blindagem: se já há qualquer escala mensal, a migração é ignorada para nunca sobrescrever.
  const jaTemGavetas = Object.keys(ESCALAS).length>0;
  if(escalaAntiga && escalaAntiga.shifts && escalaAntiga.shifts.length && !jaTemGavetas){
    const d0 = escalaAntiga.shifts.map(s=>s.data).sort()[0];
    const ym = d0.slice(0,7);
    ESCALAS[ym] = escalaAntiga;
    if(supa) supa.from('estado').upsert({chave:'escala:'+ym, valor:escalaAntiga, atualizado_por:'migração v11'}, {onConflict:'chave'})
      .then(({error})=>{ if(error) console.error('migração:',error); });
  }
  loadEscala();
  return true;
}
function carregarAud(){
  if(!supa||!user) return;
  supa.from('auditoria').select('*').order('id',{ascending:false}).limit(300).then(({data,error})=>{
    if(error||!data) return;
    const novo=data.map(r=>({ts:new Date(r.ts).toLocaleString('pt-BR'),quem:r.quem,acao:r.acao,detalhe:r.detalhe}));
    const mudou = novo.length!==AUD.length;
    AUD=novo;
    if(mudou && tab==='aud' && !document.getElementById('ov')) render();
  });
}
let canal=null, poll=null;
function assinarTempoReal(){
  if(canal||!supa) return;
  canal = supa.channel('estado-sync').on('postgres_changes',
    {event:'*', schema:'public', table:'estado'}, p=>{
      const r=p.new; if(!r||!r.chave) return;
      if(r.chave.startsWith('escala:')){ const ym=r.chave.slice(7);
        if(r.valor&&r.valor.shifts&&r.valor.shifts.length){ ESCALAS[ym]=r.valor; } else { delete ESCALAS[ym]; }
        loadEscala(); }
      else if(r.chave.startsWith('reg:')) S[r.chave.slice(4)]=r.valor;
      if(!document.getElementById('ov')) render();
    }).subscribe();
  poll = setInterval(async()=>{
    if(user && !document.getElementById('ov')){ await carregarNuvem(); render(); }
  }, 60000);
}

let SHIFTS = [], MEDICOS = [], MES = {};

const MESES = ['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function ymAtual(){ const t=new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}`; }
function mesesDisponiveis(){ return Object.keys(ESCALAS).filter(k=>ESCALAS[k]&&ESCALAS[k].shifts&&ESCALAS[k].shifts.length).sort(); }
function rotuloMes(ym){ const [y,m]=ym.split('-').map(Number); return MESES[m]+'/'+y; }
function wdPT(iso){ return ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][new Date(iso+'T12:00:00').getDay()]; }
// Feriados nacionais (fixos + móveis calculados pela Páscoa)
function pascoa(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1; return new Date(Date.UTC(y,mes-1,dia)); }
function feriadosDe(y){
  const f={};
  const fix=[['01-01','Confraternização'],['04-21','Tiradentes'],['05-01','Dia do Trabalho'],['09-07','Independência'],['10-12','N. Sra. Aparecida'],['11-02','Finados'],['11-15','Proclamação da República'],['11-20','Consciência Negra'],['12-25','Natal']];
  fix.forEach(([md,nome])=>f[`${y}-${md}`]=nome);
  const P=pascoa(y), addd=(base,n)=>{const x=new Date(base); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10);};
  f[addd(P,-47)]='Carnaval'; f[addd(P,-46)]='Q. Cinzas'; f[addd(P,-2)]='Sexta Santa'; f[addd(P,0)]='Páscoa'; f[addd(P,60)]='Corpus Christi';
  return f;
}
function feriadoNome(iso){ return feriadosDe(Number(iso.slice(0,4)))[iso] || null; }
function loadEscala(){
  const disp = mesesDisponiveis();
  // define o mês ativo: mantém o já escolhido se ainda existir; senão mês corrente; senão o mais recente disponível
  if(!mesAtivo || !ESCALAS[mesAtivo]){
    const hoje = ymAtual();
    mesAtivo = ESCALAS[hoje] ? hoje : (disp.length ? disp[disp.length-1] : null);
  }
  const imp = mesAtivo ? ESCALAS[mesAtivo] : null;
  SHIFTS = (imp && imp.shifts && imp.shifts.length) ? imp.shifts : DB.shifts;
  MEDICOS = [...new Set(SHIFTS.map(s=>s.medico).filter(m=>m && m!=='A DEFINIR'))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const d0 = SHIFTS.map(s=>s.data).sort()[0];
  const [y,m] = d0.split('-').map(Number);
  MES = { y, m, dias:new Date(y,m,0).getDate(), label:MESES[m]+'/'+y, ym:`${y}-${String(m).padStart(2,'0')}`,
          custom: !!(imp && imp.shifts && imp.shifts.length), info: imp ? imp.info : '',
          corrente: (`${y}-${String(m).padStart(2,'0')}`===ymAtual()) };
  selDate = todayISO();
}
function todayISO(){
  const t = new Date();
  if (t.getFullYear()===MES.y && t.getMonth()+1===MES.m) return t.toISOString().slice(0,10);
  return `${MES.y}-${String(MES.m).padStart(2,'0')}-01`;
}
function st(id){ return S[id] || {}; }
function syncReg(id){
  supa.from('estado').upsert({chave:'reg:'+id, valor:S[id], atualizado_em:new Date().toISOString(), atualizado_por:autor()})
    .then(({error})=>{ if(error){ console.error(error); toast('Falha ao salvar no banco — tente novamente.'); } });
}
function save(id, patch){
  S[id] = {...st(id), ...patch};
  render();
  syncReg(id);
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
function fmtD(iso){ const [y,m,d]=iso.split('-'); return d+'/'+m; }
function nowHM(){ return new Date().toTimeString().slice(0,5); }
function executor(s){ const x=st(s.id);
  if (x.troca && x.troca.status==='aceita') return x.troca.para;
  if (x.executor) return x.executor; // compatibilidade com registros antigos
  return s.medico; }
function statusOf(s){
  const x = st(s.id);
  if (s.medico==='A DEFINIR' && !x.executor) return 'def';
  if (x.status==='Falta') return 'falta';
  if (x.status==='Realizado') return 'ok';
  if (x.in && !x.out) return 'in';
  return 'pend';
}
const CHIP = {pend:['c-pend','Previsto'], in:['c-in','Em plantão'], ok:['c-ok','Realizado'], falta:['c-falta','Falta'], def:['c-def','A definir']};
function bandClass(s){
  if (s.setor==='UNI') return 'b-UNI';
  if (s.papel.startsWith('Diarista')) return 'b-DIAR';
  return s.turno==='NOITE' ? 'b-NOITE' : 'b-DIA';
}
function bandLabel(s){
  if (s.setor==='UNI') return 'UNI';
  if (s.papel.startsWith('Diarista')) return '3º';
  return s.turno==='NOITE' ? 'NOITE' : 'DIA';
}

/* ---------- render raiz ---------- */
function render(){
  const app = document.getElementById('app');
  if (!user){ app.innerHTML = loginView(); return; }
  const tabs = user.tipo==='med'
    ? [['agora','Agora',icoNow()],['escala','Escala',icoCal()],['meus','Meus plantões',icoUser()]]
    : [['agora','Agora',icoNow()],['escala','Escala',icoCal()],['fech','Fechamento',icoDoc()],['aud','Auditoria',icoLog()]];
  if (!tabs.some(t=>t[0]===tab)) tab='agora';
  const quem = user.tipo==='coord'?'Coordenação Médica':user.tipo==='adm'?'Administrativo · validação de internações':user.nome;
  app.innerHTML = `
    <header>
      <img src="${LOGO}" alt="Hospital Alagoinhas">
      <div class="who"><b>${quem}</b>
        <button onclick="abrirMinhaSenha()">senha</button> · <button onclick="logout()">sair</button></div>

    <nav>${tabs.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[2]}${t[1]}</button>`).join('')}</nav>
    <main>${tab==='agora'?agoraView():tab==='escala'?escalaView():tab==='meus'?meusView():tab==='aud'?audView():fechView()}</main>`;
}
function go(t){ tab=t; if(t==='aud') carregarAud(); render(); window.scrollTo(0,0); }
async function logout(){
  if(supa){ try{ await supa.auth.signOut(); }catch(e){} }
  if(canal){ try{ supa.removeChannel(canal); }catch(e){} canal=null; }
  if(poll){ clearInterval(poll); poll=null; }
  user=null; S={}; AUD=[]; render();
}

function descS(s){ return fmtD(s.data)+' · '+(s.setor==='EME'?'Emergência':'Internação')+' · '+s.turno+' · '+s.papel+' · escalado: '+s.medico; }

async function doLogin(){
  const email=(document.getElementById('lemail').value||'').trim().toLowerCase();
  const senha=document.getElementById('senha').value||'';
  const err=document.getElementById('pwerr');
  if(!email||!senha){ err.textContent='Preencha e-mail e senha.'; err.style.display='block'; return; }
  document.getElementById('btnentrar').textContent='Entrando…';
  const {data,error} = await supa.auth.signInWithPassword({email, password:senha});
  if(error){
    document.getElementById('btnentrar').textContent='Entrar';
    err.textContent='E-mail ou senha incorretos.'; err.style.display='block'; return;
  }
  await aposLogin(data.session);
}
async function aposLogin(session){
  const uid=session.user.id;
  const {data:p,error} = await supa.from('perfis').select('*').eq('user_id',uid).maybeSingle();
  if(error||!p){
    await supa.auth.signOut(); user=null; render();
    setTimeout(()=>{ const e=document.getElementById('pwerr');
      if(e){ e.textContent='Sua conta existe mas ainda não tem perfil definido. Peça à coordenação para cadastrá-lo na tabela de perfis.'; e.style.display='block'; } },50);
    return;
  }
  user={tipo:p.perfil, nome:p.nome, email:p.email};
  await carregarNuvem();
  assinarTempoReal();
  carregarAud();
  tab='agora'; render();
}

  const ov=document.createElement('div'); ov.className='overlay'; ov.id='ov';
  ov.innerHTML=`<div class="sheet">
    <h3>Alterar minha senha</h3>
    <p>Somente a sua conta (${user.email}) será alterada.</p>
    <input type="password" id="ns1" placeholder="Nova senha (mín. 6 caracteres)">
    <input type="password" id="ns2" placeholder="Repita a nova senha">
    <div id="nserr" style="display:none;color:var(--danger);font-size:13px;font-weight:600;margin-bottom:10px"></div>
    <div class="row">
      <button class="btn" onclick="closeOv()">Cancelar</button>
      <button class="btn pri" onclick="salvarMinhaSenha()">Salvar</button>
    </div></div>`;
  ov.addEventListener('click',e=>{ if(e.target===ov) closeOv(); });

async function salvarMinhaSenha(){
  const a=document.getElementById('ns1').value, b=document.getElementById('ns2').value, e=document.getElementById('nserr');
  if(a.length<6){ e.textContent='A senha precisa ter pelo menos 6 caracteres.'; e.style.display='block'; return; }

  const {error}=await supa.auth.updateUser({password:a});
  if(error){ e.textContent='Não foi possível alterar: '+error.message; e.style.display='block'; return; }
  log('Senha da própria conta alterada','via app');
  closeOv(); toast('Senha alterada com sucesso.');

function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

/* ---------- Escala ---------- */
function escalaView(){
  const off = (new Date(MES.y, MES.m-1, 1).getDay()+6)%7; // seg=0
  const hoje = todayISO();
  // seletor de mês (quando há mais de um mês arquivado)
  const disp = mesesDisponiveis();
  let seletor='';
  if(disp.length>1 || (disp.length===1 && !MES.corrente)){
    seletor = `<div class="mesbar">
      <span class="mesbar-lbl">Mês:</span>
      <select class="messel" onchange="trocarMes(this.value)">
        ${disp.map(ym=>`<option value="${ym}" ${ym===MES.ym?'selected':''}>${rotuloMes(ym)}${ym===ymAtual()?' (atual)':''}</option>`).join('')}
      </select>
      ${!MES.corrente && ESCALAS[ymAtual()]?`<button class="btn" style="padding:6px 12px;font-size:13px" onclick="trocarMes('${ymAtual()}')">Ir para mês atual</button>`:''}
    </div>`;
  }
  const fer = feriadosDe(MES.y);
  let cal = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(w=>`<span class="wd">${w}</span>`).join('');
  for(let i=0;i<off;i++) cal += `<span></span>`;
  const alerta = user.tipo==='coord' ? trocasNaoVistas() : new Set();
  for(let i=1;i<=MES.dias;i++){
    const iso=`${MES.y}-${String(MES.m).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    const eh=fer[iso]?' feriado':'';
    cal += `<button class="${iso===selDate?'sel':''}${iso===hoje?' today':''}${alerta.has(iso)?' alerta':''}${eh}" onclick="pick('${iso}')" ${fer[iso]?`title="${fer[iso]}"`:''}>${i}</button>`;
  }
  let list = SHIFTS.filter(s=>s.data===selDate);
  if (selSetor!=='TODOS') list=list.filter(s=>s.setor===selSetor);
  const selLabel = new Date(selDate+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long'});
  const ferNome = feriadoNome(selDate);
  return `
    ${seletor}
    <div class="calgrid">${cal}</div>
    <h2 style="margin-top:4px">${cap(selLabel)}${ferNome?` <span style="color:var(--danger);font-size:12px;font-weight:700">· ${ferNome}</span>`:''}</h2>
    <div class="filters"><div class="seg">
      ${['TODOS','EME','UNI'].map(x=>`<button class="${selSetor===x?'on':''}" onclick="setor('${x}')">${x==='TODOS'?'Todos':x==='EME'?'Emergência':'Internação'}</button>`).join('')}
    </div></div>
    ${list.map(card).join('') || '<div class="empty">Sem plantões neste filtro.</div>'}`;
}
function pick(d){ selDate=d; render(); }
function setor(x){ selSetor=x; render(); }
function trocarMes(ym){ if(!ESCALAS[ym]) return; mesAtivo=ym; selSetor='TODOS'; loadEscala();
  // ao trocar de mês, posiciona no dia 1 (ou hoje, se for o mês corrente)
  selDate = (ym===ymAtual()) ? todayISO() : ym+'-01';
  render(); window.scrollTo(0,0);
}

/* ---------- Meus plantões ---------- */
function meusView(){
  const pedidos = SHIFTS.filter(s=>{const t=st(s.id).troca; return t&&t.status==='pendente'&&t.para===user.nome;});
  const mine = SHIFTS.filter(s=>executor(s)===user.nome);
  const today = todayISO();
  const prox = mine.filter(s=>s.data>=today);
  const past = mine.filter(s=>s.data<today);
  const n = mine.length, ok = mine.filter(s=>statusOf(s)==='ok').length;
  return `
    <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
      <div class="kpi"><div class="v">${n}</div><div class="l">No mês</div></div>
      <div class="kpi g"><div class="v">${ok}</div><div class="l">Realizados</div></div>
      <div class="kpi y"><div class="v">${n-ok}</div><div class="l">Pendentes</div></div>
    </div>
    ${pedidos.length?`<h2 style="color:var(--warn)">Trocas aguardando sua confirmação</h2>${pedidos.map(card).join('')}`:''}
    <h2>Próximos</h2>${prox.map(card).join('')||'<div class="empty">Nenhum plantão futuro.</div>'}
    <h2>Anteriores</h2>${past.map(card).join('')||'<div class="empty">Nada por aqui ainda.</div>'}`;
}

/* ---------- card ---------- */
function card(s){
  const x = st(s.id), stt = statusOf(s), [cls,lbl] = CHIP[stt];
  const exec = executor(s);
  const tr = x.troca;
  const trocado = exec!==s.medico;
  const isMine = user.tipo==='med' && exec===user.nome;
  const canAct = isMine || user.tipo==='coord';
  let acts='';
  // fluxo de aceite da troca
  if (tr && tr.status==='pendente'){
    if (user.tipo==='med' && tr.para===user.nome){
      acts += `<button class="btn ok" onclick="aceitarTroca('${s.id}')">Aceitar troca</button>
               <button class="btn dan" onclick="recusarTroca('${s.id}')">Recusar</button>`;
    }
    if ((user.tipo==='med' && s.medico===user.nome) || user.tipo==='coord'){
      acts += `<button class="btn" onclick="cancelarTroca('${s.id}')">Cancelar solicitação</button>`;
    }
  }
  if (user.tipo==='coord' && tr && tr.status==='aceita' && !tr.vista){
    acts += `<button class="btn pri blink" onclick="cienteTroca('${s.id}')">Troca confirmada — marcar como vista</button>`;
  }
  if (canAct && s.medico!=='A DEFINIR' || (user.tipo==='coord')){
    if (stt==='pend' || stt==='def'){
      acts += user.tipo==='med'
        ? `<button class="btn pri" onclick="checkin('${s.id}')">Registrar entrada</button>
           <button class="btn warn" onclick="openTroca('${s.id}')">Passar plantão</button>`
        : `<button class="btn ok" onclick="markOk('${s.id}')">Confirmar realizado</button>
           <button class="btn warn" onclick="openTroca('${s.id}')">Registrar troca</button>
           <button class="btn dan" onclick="markFalta('${s.id}')">Marcar falta</button>`;
    } else if (stt==='in'){
      acts += `<button class="btn ok" onclick="checkout('${s.id}')">Registrar saída</button>`;
    } else if (user.tipo==='coord'){
      acts += `<button class="btn" onclick="reset('${s.id}')">Reabrir</button>`;
    }
  }
  const K = x.intern || [];
  if (s.setor==='EME' && s.medico!=='A DEFINIR' && (isMine || user.tipo==='coord' || user.tipo==='adm')){
    acts += `<button class="btn" onclick="openIntern('${s.id}')">Internações${K.length?` (${K.length})`:''}</button>`;
  }
  const nUI=K.filter(i=>i.u==='UI'&&i.val).length, nUTI=K.filter(i=>i.u==='UTI'&&i.val).length, nAg=K.filter(i=>!i.val).length;
  const stamps = [
    x.in ? `Entrada <b class="mono">${x.in}</b>` : '',
    x.out ? `Saída <b class="mono">${x.out}</b>` : '',
    K.length ? `Internações validadas: <b>${nUI} UI</b> · <b>${nUTI} UTI</b>${nAg?` · <span style="color:var(--warn);font-weight:700">${nAg} aguardando</span>`:''}` : '',
    tr ? (tr.status==='pendente'
            ? `<span style="color:var(--warn);font-weight:700">Troca solicitada — aguardando aceite de ${tr.para}</span>`
            : tr.status==='recusada'
              ? `<span style="color:var(--danger);font-weight:700">Troca recusada por ${tr.para}</span>`
              : `Troca confirmada: ${s.medico} → <b>${tr.para}</b> (aceita em ${tr.aceitaTs})`)
       : (trocado ? `Troca: escalado ${s.medico} → executor <b>${exec}</b>` : ''),
    x.obs ? `Obs: ${x.obs}` : ''
  ].filter(Boolean).join(' · ');
  return `<div class="card">
    <div class="band ${bandClass(s)}"><span class="d">${s.data.slice(8)}</span><span class="m">${bandLabel(s)}</span></div>
    <div class="body">
      <div class="top"><span class="med">${exec}</span><span class="chip ${cls}">${lbl}</span></div>
      <div class="papel">${s.setor==='EME'?'Emergência':'Internação'} · ${s.papel}${trocado?' · substituindo '+s.medico:''}</div>
      <div class="hrs">${fmtD(s.data)} (${s.dia}) · <b class="mono">${s.hini}–${s.hfim}</b></div>
      ${stamps?`<div class="stamp">${stamps}</div>`:''}
      ${acts?`<div class="acts">${acts}</div>`:''}
    </div></div>`;
}

/* ---------- ações ---------- */
function sh(id){ return SHIFTS.find(x=>x.id===id); }
function dataPassada(iso){ const h=new Date(); h.setHours(0,0,0,0); return new Date(iso+'T00:00:00') < h; }
function checkin(id){ log('Entrada registrada', descS(sh(id))); save(id,{in:nowHM()}); toast('Entrada registrada. Bom plantão!'); }
function checkout(id){ log('Saída registrada · plantão confirmado', descS(sh(id))); save(id,{out:nowHM(), status:'Realizado'}); toast('Saída registrada — plantão confirmado.'); }
function markOk(id){ log('Plantão confirmado manualmente', descS(sh(id))); save(id,{status:'Realizado'}); toast('Plantão confirmado.'); }
function markFalta(id){ log('Falta registrada', descS(sh(id))); save(id,{status:'Falta'}); toast('Falta registrada.'); }
function reset(id){ log('Plantão reaberto (status/horários apagados)', descS(sh(id))); save(id,{status:'', in:'', out:''}); toast('Plantão reaberto.'); }

let trocaId=null;
function openTroca(id){
  trocaId=id;
  const s = SHIFTS.find(x=>x.id===id);
  if(user.tipo==='med' && dataPassada(s.data)){
    const ov=document.createElement('div'); ov.className='overlay'; ov.id='ov';
    ov.innerHTML=`<div class="sheet">
      <h3>Troca em data passada</h3>
      <p>Este plantão é de ${fmtD(s.data)}, uma data já passada. Trocas em datas passadas não podem ser feitas pelo plantonista.<br><br>Procure o coordenador da escala (Magno) para qualquer ajuste retroativo.</p>
      <div class="row"><button class="btn pri" onclick="closeOv()">Entendi</button></div>
    </div>`;
    ov.addEventListener('click',e=>{ if(e.target===ov) closeOv(); });
    document.body.appendChild(ov);
    return;
  }
  const ov = document.createElement('div'); ov.className='overlay'; ov.id='ov';
  ov.innerHTML = `<div class="sheet">
    <h3>${s.medico==='A DEFINIR'?'Definir plantonista':(user.tipo==='med'?'Solicitar troca de plantão':'Registrar troca')}</h3>
    <p>${fmtD(s.data)} · ${s.setor==='EME'?'Emergência':'Internação'} · ${s.papel} · ${s.hini}–${s.hfim}${user.tipo==='med'?'<br>O colega escolhido precisará <b>aceitar</b> a troca no app para que ela valha no registro oficial.':''}</p>
    <select id="sub">${MEDICOS.filter(m=>m!==s.medico).map(m=>`<option>${m}</option>`).join('')}</select>
    <input id="obs" placeholder="Motivo / observação (opcional)">
    <div class="row">
      <button class="btn" onclick="closeOv()">Cancelar</button>
      <button class="btn pri" onclick="confirmaTroca()">${user.tipo==='med'?'Enviar solicitação':'Confirmar'}</button>
    </div></div>`;
  ov.addEventListener('click',e=>{ if(e.target===ov) closeOv(); });
  document.body.appendChild(ov);
}
function closeOv(){ const o=document.getElementById('ov'); if(o) o.remove(); if(user) render(); }
function confirmaTroca(){
  const sub=document.getElementById('sub').value, obs=document.getElementById('obs').value;
  const s=sh(trocaId);
  const agora=new Date().toLocaleString('pt-BR');
  if (s.medico!=='A DEFINIR' && user.tipo==='med'){
    log('Troca solicitada → '+sub+(obs?' · motivo: '+obs:''), descS(s));
    closeOv(); save(trocaId,{troca:{para:sub, motivo:obs, por:autor(), ts:agora, status:'pendente'}, obs});
    toast('Solicitação enviada — aguardando aceite de '+sub+'.');
  } else {
    log((s.medico==='A DEFINIR'?'Plantonista definido':'Troca registrada pela coordenação')+' → '+sub+(obs?' · motivo: '+obs:''), descS(s));
    closeOv(); save(trocaId,{troca:{para:sub, motivo:obs, por:autor(), ts:agora, status:'aceita', aceitaTs:agora, aceitoPor:autor(), vista:true}, obs});
    toast('Troca registrada para '+sub+'.');
  }
}
function aceitarTroca(id){
  const x=st(id); if(!x.troca) return;
  const agora=new Date().toLocaleString('pt-BR');
  log('Troca ACEITA pelo substituto', descS(sh(id))+' · substituto: '+x.troca.para);
  save(id,{troca:{...x.troca, status:'aceita', aceitaTs:agora, aceitoPor:autor(), vista:false}});
  toast('Troca confirmada — o plantão agora é seu. A coordenação foi sinalizada.');
}
function recusarTroca(id){
  const x=st(id); if(!x.troca) return;
  log('Troca RECUSADA pelo substituto', descS(sh(id))+' · substituto: '+x.troca.para);
  save(id,{troca:{...x.troca, status:'recusada'}});
  toast('Troca recusada — o plantão segue com o escalado original.');
}
function cancelarTroca(id){
  const x=st(id); if(!x.troca) return;
  log('Solicitação de troca cancelada', descS(sh(id))+' · substituto proposto: '+x.troca.para);
  save(id,{troca:null});
  toast('Solicitação cancelada.');
}
function cienteTroca(id){
  const x=st(id); if(!x.troca) return;
  log('Troca visualizada pela coordenação (ciente)', descS(sh(id))+' · '+sh(id).medico+' → '+x.troca.para);
  save(id,{troca:{...x.troca, vista:true}});
  toast('Marcada como vista.');
}
function trocasNaoVistas(){
  const dias=new Set();
  SHIFTS.forEach(s=>{const t=st(s.id).troca; if(t&&t.status==='aceita'&&!t.vista) dias.add(s.data);});
  return dias;
}

function abrev(n){
  if(!n||n==='A DEFINIR') return '— A DEFINIR —';
  const p=n.split(' '); return p.length>1 ? p[0]+' '+p[p.length-1][0]+'.' : p[0];
}
function printMes(){
  log('Impressão da escala do mês (Emergência + Internação)', MES.label);
  const pa=document.getElementById('printArea');
  pa.className='onepage';
  const wd=['SEG','TER','QUA','QUI','SEX','SÁB','DOM'];
  const off = (new Date(MES.y, MES.m-1, 1).getDay()+6)%7; // seg=0
  let cells=[]; for(let i=0;i<off;i++) cells.push(null);
  for(let d=1;d<=MES.dias;d++) cells.push(d);
  while(cells.length%7) cells.push(null);
  const weeks=[]; for(let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
  const isoDe = d => `${MES.y}-${String(MES.m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const cellEME = d=>{
    if(!d) return '<td class="off"></td>';
    const L=SHIFTS.filter(s=>s.data===isoDe(d)&&s.setor==='EME');
    const g=f=>L.filter(f).map(s=>abrev(executor(s))).join(' / ');
    const diar=L.find(s=>s.papel.startsWith('Diarista'));
    return `<td><div class="dn">${d}</div>
      <div class="ln"><b>DIA</b> ${g(s=>s.turno==='DIA'&&s.papel.startsWith('Plantonista'))}</div>
      <div class="ln"><b>NOITE</b> ${g(s=>s.turno==='NOITE')}</div>
      ${diar?`<div class="ln"><b>3º</b> ${abrev(executor(diar))}</div>`:''}
    </td>`;
  };
  const cellUNI = d=>{
    if(!d) return '<td class="off"></td>';
    const L=SHIFTS.filter(s=>s.data===isoDe(d)&&s.setor==='UNI');
    if(!L.length) return `<td><div class="dn">${d}</div></td>`;
    return `<td><div class="dn">${d}</div>
      ${L.map(s=>`<div class="ln uni"><b>${s.papel.slice(0,4)}</b> ${abrev(executor(s))}</div>`).join('')}
    </td>`;
  };
  const grade = (titulo, sub, cell) => `
    <div class="ph"><img src="${LOGO}" alt=""><div>
      <h1>${titulo} – ${MES.label.toUpperCase()}</h1>
      <div class="pi">${sub} · Nomes já refletem trocas registradas · Emitido em ${new Date().toLocaleString('pt-BR')} por ${autor()} · Documento para Contas Médicas</div>
    </div></div>
    <table class="cal"><thead><tr>${wd.map(w=>`<th>${w}</th>`).join('')}</tr></thead>
    <tbody>${weeks.map(w=>`<tr>${w.map(cell).join('')}</tr>`).join('')}</tbody></table>`;
  pa.innerHTML =
    grade('ESCALA MÉDICA – UNIDADE DE EMERGÊNCIA','DIA 07–19h · NOITE 19–07h · 3º = diarista (3º plantonista)', cellEME)
    + `<div class="pgbreak"></div>`
    + grade('ESCALA MÉDICA – UNIDADE DE INTERNAÇÃO','Hosp = hospitalista · Plan = plantonista · 07–19h', cellUNI);
  window.print();
}

function modeloCSV(){
  const head='data;setor;turno;funcao;medico;hora_inicio;hora_fim\n';
  const body=SHIFTS.map(s=>[s.data,s.setor,s.turno,s.papel,s.medico,s.hini,s.hfim].join(';')).join('\n');
  const blob=new Blob(['\uFEFF'+head+body],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`modelo_escala_${MES.m}_${MES.y}.csv`; a.click();
  toast('Modelo baixado — edite no Excel e reimporte.');

function parseData(v){
  v=v.trim();
  let m=v.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(m) return v;
  m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null;
}
function importarEscala(){
  const err=document.getElementById('imperr');
  const raw=document.getElementById('imptxt').value.replace(/^\uFEFF/,'').trim();
  if(!raw){ err.textContent='Cole o CSV ou selecione um arquivo.'; err.style.display='block'; return; }
  const lines=raw.split(/\r?\n/).filter(l=>l.trim());
  const shifts=[]; let n=0;
  for(let i=0;i<lines.length;i++){
    const l=lines[i];
    if(i===0 && /data/i.test(l) && /setor/i.test(l)) continue; // cabeçalho
    const c=l.split(';').map(x=>x.trim());
    if(c.length<5){ err.textContent=`Linha ${i+1}: esperadas ao menos 5 colunas separadas por ";" — encontrei ${c.length}.`; err.style.display='block'; return; }
    const data=parseData(c[0]);
    if(!data){ err.textContent=`Linha ${i+1}: data inválida "${c[0]}". Use DD/MM/AAAA ou AAAA-MM-DD.`; err.style.display='block'; return; }
    const setor=c[1].toUpperCase();
    if(setor!=='EME'&&setor!=='UNI'){ err.textContent=`Linha ${i+1}: setor "${c[1]}" — use EME ou UNI.`; err.style.display='block'; return; }
    const turno=c[2].toUpperCase();
    if(turno!=='DIA'&&turno!=='NOITE'){ err.textContent=`Linha ${i+1}: turno "${c[2]}" — use DIA ou NOITE.`; err.style.display='block'; return; }
    if(!c[3]){ err.textContent=`Linha ${i+1}: função vazia.`; err.style.display='block'; return; }
    if(!c[4]){ err.textContent=`Linha ${i+1}: médico vazio — use A DEFINIR para vaga em aberto.`; err.style.display='block'; return; }
    n++;
    shifts.push({ id:'I'+String(n).padStart(4,'0'), data, dia:wdPT(data), setor, turno,
      papel:c[3], medico:c[4], hini:c[5]||(turno==='NOITE'?'19:00':'07:00'), hfim:c[6]||(turno==='NOITE'?'07:00':'19:00') });
  }
  if(!shifts.length){ err.textContent='Nenhum plantão válido encontrado no arquivo.'; err.style.display='block'; return; }
  const meses=[...new Set(shifts.map(s=>s.data.slice(0,7)))];
  if(meses.length>1){ err.textContent=`O arquivo mistura meses diferentes (${meses.join(', ')}). Importe um mês por vez.`; err.style.display='block'; return; }
  const ym = meses[0];
  const existente = ESCALAS[ym] && ESCALAS[ym].shifts && ESCALAS[ym].shifts.length;
  const outrosMeses = mesesDisponiveis().filter(k=>k!==ym);
  // Confirmação clara, deixando explícito que SÓ o mês do arquivo é afetado
  const msg = existente
    ? `Já existe escala para ${rotuloMes(ym)} (${ESCALAS[ym].shifts.length} plantões). Deseja SUBSTITUIR a grade de ${rotuloMes(ym)} por esta nova (${shifts.length} plantões)?\n\nOs registros de plantão (entradas, trocas, internações) NÃO são apagados.${outrosMeses.length?`\nOs outros meses (${outrosMeses.map(rotuloMes).join(', ')}) NÃO são afetados.`:''}`
    : `Importar a escala de ${rotuloMes(ym)} (${shifts.length} plantões)?${outrosMeses.length?`\n\nOs outros meses já cadastrados (${outrosMeses.map(rotuloMes).join(', ')}) NÃO são afetados.`:''}`;
  if(!confirm(msg)) return;
  closeOv();
  const info=`${shifts.length} plantões, em ${new Date().toLocaleString('pt-BR')} por ${autor()}`;
  log((existente?'Escala SUBSTITUÍDA em ':'Escala importada para ')+rotuloMes(ym), info);
  // PROTEÇÃO: grava APENAS a chave deste mês. Impossível atingir outra gaveta.
  ESCALAS[ym]={shifts, info};
  mesAtivo = ym;
  supa.from('estado').upsert({chave:'escala:'+ym, valor:ESCALAS[ym], atualizado_por:autor()}, {onConflict:'chave'})
    .then(({error})=>{ if(error){ toast('Falha ao publicar a escala no banco.'); console.error(error);} else { toast('Escala de '+rotuloMes(ym)+' salva. Outros meses preservados.'); } });
  loadEscala(); selSetor='TODOS'; render();
}
function restoreEscala(){
  const ym = MES.ym;
  if(!confirm(`Remover a escala de ${rotuloMes(ym)}? Os registros de plantão desse mês permanecem no banco (auditoria preservada), mas a grade some da visualização até nova importação.`)) return;
  closeOv();
  log('Escala removida de '+rotuloMes(ym),'grade descartada; registros preservados');
  delete ESCALAS[ym];
  if(supa) supa.from('estado').upsert({chave:'escala:'+ym, valor:{shifts:[],info:''}, atualizado_por:autor()})
    .then(({error})=>{ if(error) toast('Falha ao atualizar o banco.'); });
  mesAtivo=null; loadEscala(); render(); toast('Escala de '+rotuloMes(ym)+' removida.');
}

/* ---------- Internações (plantões da Emergência) ---------- */
let internId=null;
function openIntern(id){
  internId=id; uSel='UI';
  const s=sh(id), K=st(id).intern||[];
  const podeAdd = (user.tipo==='med' && executor(s)===user.nome) || user.tipo==='coord';
  const ov=document.createElement('div'); ov.className='overlay'; ov.id='ov';
  ov.innerHTML=`<div class="sheet" style="max-height:88dvh;overflow-y:auto">
    <h3>Internações do plantão</h3>
    <p>${fmtD(s.data)} (${s.dia}) · Emergência · ${s.turno} · ${s.papel} · executor: <b>${executor(s)}</b><br>
    ${user.tipo==='adm'
      ? 'Confira cada registro no sistema e valide. Somente internações validadas entram no fechamento e nas exportações para contas médicas.'
      : 'Registre cada internação com a unidade de destino e o nº de atendimento. O pagamento extra considera apenas internações validadas pelo administrativo.'}</p>
    <div id="ilist">${internLista(st(id).intern||[])}</div>
    ${podeAdd?`
    <label style="font-size:12px;font-weight:700;color:var(--mut)">Unidade de destino</label>
    <div class="seg" style="margin-bottom:12px">
      <button type="button" id="uUI" class="on" onclick="pickU('UI')">UI · Unidade aberta</button>
      <button type="button" id="uUTI" onclick="pickU('UTI')">UTI · Terapia intensiva</button>
    </div>
    <label style="font-size:12px;font-weight:700;color:var(--mut)">Nº do atendimento</label>
    <input id="iat" inputmode="numeric" placeholder="Ex.: 2026084512" onkeydown="if(event.key==='Enter')addIntern()">
    <div id="ierr" style="display:none;color:var(--danger);font-size:13px;font-weight:600;margin-bottom:10px"></div>
    <div class="row">
      <button class="btn" onclick="closeOv()">Fechar</button>
      <button class="btn pri" onclick="addIntern()">Adicionar internação</button>
    </div>`:`
    <div class="row"><button class="btn" onclick="closeOv()">Fechar</button></div>`}
  </div>`;
  ov.addEventListener('click',e=>{ if(e.target===ov) closeOv(); });
  document.body.appendChild(ov);
}
let uSel='UI';
function pickU(u){ uSel=u;
  document.getElementById('uUI').className = u==='UI'?'on':'';
  document.getElementById('uUTI').className = u==='UTI'?'on':'';
}
function internLista(K){
  if(!K.length) return `<div class="empty" style="margin-bottom:14px;padding:16px">Nenhuma internação registrada neste plantão.</div>`;
  const s=sh(internId);
  const souExec = user.tipo==='med' && executor(s)===user.nome;
  const podeValidar = user.tipo==='adm' || user.tipo==='coord';
  return `<div style="margin-bottom:14px">`+K.map((i,ix)=>{
    let botoes='';
    if(podeValidar) botoes += i.val
      ? `<button class="btn warn" style="padding:6px 10px;font-size:12px" onclick="invalIntern(${ix})">Desfazer</button>`
      : `<button class="btn ok" style="padding:6px 10px;font-size:12px" onclick="valIntern(${ix})">Validar</button>`;
    if(user.tipo==='coord' || (souExec && !i.val))
      botoes += `<button class="btn dan" style="padding:6px 10px;font-size:12px" onclick="delIntern(${ix})">Excluir</button>`;
    return `
    <div style="display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:7px">
      <span class="chip ${i.u==='UTI'?'c-falta':'c-in'}" style="min-width:38px;text-align:center">${i.u}</span>
      <div style="flex:1;min-width:0">
        <div class="mono" style="font-size:14px;font-weight:600">${i.at}</div>
        <div style="font-size:11px;color:var(--mut)">${i.por} · ${i.ts}</div>
        <div style="margin-top:3px"><span class="chip ${i.val?'c-ok':'c-troca'}">${i.val?'Validada · '+i.valPor+' · '+i.valTs:'Aguardando validação'}</span></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px">${botoes}</div>
    </div>`;}).join('')+`</div>`;
}
function valIntern(ix){
  const K=[...(st(internId).intern||[])];
  K[ix]={...K[ix], val:true, valPor:autor(), valTs:new Date().toLocaleString('pt-BR')};
  log(`Internação validada · ${K[ix].u} · atendimento ${K[ix].at}`, descS(sh(internId)));
  S[internId]={...st(internId), intern:K}; syncReg(internId);
  document.getElementById('ilist').innerHTML=internLista(K);
  toast('Internação validada.');
}
function invalIntern(ix){
  const K=[...(st(internId).intern||[])];
  const i=K[ix];
  K[ix]={...i, val:false, valPor:'', valTs:''};
  log(`Validação desfeita · ${i.u} · atendimento ${i.at}`, descS(sh(internId)));
  S[internId]={...st(internId), intern:K}; syncReg(internId);
  document.getElementById('ilist').innerHTML=internLista(K);
  toast('Validação desfeita — voltou para aguardando.');
}
function addIntern(){
  const err=document.getElementById('ierr');
  const at=document.getElementById('iat').value.trim();
  if(!at){ err.textContent='Informe o nº do atendimento.'; err.style.display='block'; return; }
  const K=st(internId).intern||[];
  if(K.some(i=>i.at===at)){ err.textContent='Este nº de atendimento já foi registrado neste plantão.'; err.style.display='block'; return; }
  err.style.display='none';
  const s=sh(internId);
  const nova={u:uSel, at, ts:new Date().toLocaleString('pt-BR'), por:autor()};
  log(`Internação registrada · ${uSel} · atendimento ${at}`, descS(s));
  S[internId]={...st(internId), intern:[...K, nova]}; syncReg(internId);
  document.getElementById('iat').value='';
  document.getElementById('ilist').innerHTML=internLista(st(internId).intern);
  toast('Internação '+uSel+' registrada.');
}
function delIntern(ix){
  const K=[...(st(internId).intern||[])];
  const rem=K.splice(ix,1)[0];
  const s=sh(internId);
  log(`Internação excluída · ${rem.u} · atendimento ${rem.at}`, descS(s));
  S[internId]={...st(internId), intern:K}; syncReg(internId);
  document.getElementById('ilist').innerHTML=internLista(K);
  toast('Internação excluída.');
}
function internDe(m){ // totais de internações VALIDADAS por médico executor (EME)
  let ui=0, uti=0, ag=0;
  SHIFTS.filter(s=>s.setor==='EME' && executor(s)===m).forEach(s=>{
    (st(s.id).intern||[]).forEach(i=>{ if(!i.val){ag++;} else if(i.u==='UTI'){uti++;} else {ui++;} });
  });
  return {ui, uti, ag};
}
function internPendentes(){ let n=0;
  SHIFTS.filter(s=>s.setor==='EME').forEach(s=>{(st(s.id).intern||[]).forEach(i=>{ if(!i.val) n++; })});
  return n;
}

async function iniciar(){
  loadEscala(); render();
  if(!CONFIGURADO || !supa) return;
  try{
    const {data:{session}} = await supa.auth.getSession();
    if(session) await aposLogin(session);
  }catch(e){ console.error(e); }
}
iniciar();
